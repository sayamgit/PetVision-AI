name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PETVISION_SECRET_KEY: ci-only-synthetic-secret-not-used-by-any-deployment-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/app.txt
            requirements/deploy.txt
      - run: python -m pip install -r requirements/deploy.txt
      - run: python tools/check_repository.py
      - run: python backend/manage.py test pets
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py verify_release
      - run: python tools/package_release.py
